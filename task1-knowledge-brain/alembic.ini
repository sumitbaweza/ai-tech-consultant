# Alembic settings for the Brain's database migrations.
# The database URL comes from app.config (and so from .env), not from this file.

[alembic]
script_location = %(here)s/migrations
# Lets migrations/env.py import the `app` package
prepend_sys_path = %(here)s
path_separator = os
# Migration files are named by revision id, e.g. 0001_initial_schema.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
