# The whole system starts with one command: `make up`, or `docker compose up -d --build`.
# Values like ${POSTGRES_PASSWORD} come from the .env file next to this one.

# Set the project name here, because the repo folder's name may contain spaces.
name: ai-tech-consultant

# Shared by every Brain service: one image, the same settings
x-brain: &brain
  build: ./task1-knowledge-brain
  image: ai-tech-consultant/brain:dev
  environment:
    DB_HOST: postgres
    BRAIN_DB_PASSWORD: ${BRAIN_DB_PASSWORD:?Set BRAIN_DB_PASSWORD in .env}
    BRAIN_API_KEYS: ${BRAIN_API_KEYS:?Set BRAIN_API_KEYS in .env}
    # May be empty: the API still starts, and only Claude calls fail until it's set
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # May be empty: nothing gets embedded, and search falls back to exact words
    VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    # Where the MCP server and the screens find the API, inside the Compose network
    BRAIN_API_URL: http://brain-api:8000
    # Who may sign in to the screens. May be empty: then nobody can, and the screen says how
    BRAIN_UI_USERS: ${BRAIN_UI_USERS:-}

# Shared by both Inbox Agent services: one image, the same settings
x-inbox: &inbox
  build: ./task2-inbox-agent
  image: ai-tech-consultant/inbox:dev
  environment:
    DB_HOST: postgres
    INBOX_DB_PASSWORD: ${INBOX_DB_PASSWORD:?Set INBOX_DB_PASSWORD in .env}
    # May be empty here: then only the inbox fails, with a message saying how to set it
    AUTH_SECRET: ${AUTH_SECRET:-}
    # Behind Docker's port mapping, Auth.js has to trust the Host header it receives
    AUTH_TRUST_HOST: "true"
    # fixtures (the default) or gmail
    INBOX_MODE: ${INBOX_MODE:-fixtures}
    # May be empty: then fixtures mode has no demo sign-in, and the sign-in page says so
    INBOX_DEMO_PASSWORD: ${INBOX_DEMO_PASSWORD:-}
    # May be empty: then there is no Google sign-in
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

services:
  postgres:
    # Postgres 16 with the pgvector extension, pinned so a fresh clone gets the same database.
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: consultant
      # Read by db/init/01-schemas.sh, which creates one login role per task
      BRAIN_DB_PASSWORD: ${BRAIN_DB_PASSWORD:?Set BRAIN_DB_PASSWORD in .env}
      INBOX_DB_PASSWORD: ${INBOX_DB_PASSWORD:?Set INBOX_DB_PASSWORD in .env}
      SCOPE_DB_PASSWORD: ${SCOPE_DB_PASSWORD:?Set SCOPE_DB_PASSWORD in .env}
    ports:
      # Only reachable from this machine, for local tools and tests
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run once, when the pgdata volume is first created
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consultant"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Applies the Brain's database migrations once, then exits
  brain-migrate:
    <<: *brain
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  # The Brain's API. Docs: http://localhost:8000/docs
  brain-api:
    <<: *brain
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      brain-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Crawls queued pages: 2 tasks sharing one polite rate limit. Restarting it resumes the crawl.
  brain-worker:
    <<: *brain
    command: ["python", "-m", "app.jobs.worker"]
    depends_on:
      brain-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # The Brain's screens, behind a sign-in: http://localhost:8501
  brain-ui:
    <<: *brain
    command:
      - python
      - -m
      - streamlit
      - run
      - ui/main.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
      # The menu a viewer needs, without the developer options and the Deploy button
      - --client.toolbarMode=viewer
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      brain-api:
        condition: service_healthy
    restart: unless-stopped

  # The Brain as MCP tools for agents: http://localhost:8001/mcp
  brain-mcp:
    <<: *brain
    command: ["python", "-m", "app.mcp_server", "--http"]
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      brain-api:
        condition: service_healthy
    restart: unless-stopped

  # Applies the inbox's migrations, loads fixtures/emails.json in fixtures mode, then exits
  inbox-migrate:
    <<: *inbox
    command: ["pnpm", "db:setup"]
    depends_on:
      postgres:
        condition: service_healthy

  # The Inbox Agent, a Gmail-style app: http://localhost:3000
  inbox:
    <<: *inbox
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      inbox-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/signin').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
